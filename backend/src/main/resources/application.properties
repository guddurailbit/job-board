# --- Server ---
server.port=${PORT:8085}

# --- Datasource (MySQL) ---
# Locally: create a database first, e.g. `CREATE DATABASE theboard;`
# In production (Render/Railway/etc.), set these as environment variables instead
# of editing this file.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/theboard?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Rohit@8540}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
# Seed data is inserted in code (see DataSeeder.java), guarded so it only runs
# once (when the jobs table is empty) — safe across restarts.


jwt.secret=MyVerySecretKeyForTheBoardApplication2026
jwt.expiration=86400000

# --- CORS ---
# Set this to your deployed Vercel URL in production, e.g.
# FRONTEND_ORIGIN=https://your-app.vercel.app
frontend.origin=${FRONTEND_ORIGIN:http://localhost:5173}
